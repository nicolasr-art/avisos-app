<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avisos</title>
  <link rel="manifest" href="./manifest.json">
</head>
<body style="font-family: Arial; padding:20px; max-width:420px; margin:auto; box-sizing:border-box;">

<h2 style="margin-bottom:8px;">Avisos</h2>
<p style="margin-top:0; color:#555; font-size:14px;">Recordatorios automáticos con trabajo/personal, fecha, hora, edición, eliminación e insistencia.</p>

<label for="modoCarga">Modo de carga</label><br>
<select id="modoCarga" onchange="cambiarModoCarga()" style="width:100%; padding:10px; margin-top:6px; margin-bottom:12px; box-sizing:border-box;">
  <option value="separado" selected>Texto + fecha + hora</option>
  <option value="libre">Texto libre</option>
</select>

<div id="bloqueLibre" style="display:none;">
  <label for="textoLibre">Texto libre</label><br>
  <input id="textoLibre" type="text" placeholder="Ej: mañana 13:00 instalar hotfix en Cerro" style="width:100%; padding:10px; margin-top:6px; margin-bottom:12px; box-sizing:border-box;">
</div>

<label for="tipo">Tipo</label><br>
<select id="tipo" onchange="mostrarCampoCliente()" style="width:100%; padding:10px; margin-top:6px; margin-bottom:12px; box-sizing:border-box;">
  <option value="personal" selected>Personal</option>
  <option value="cliente">Cliente</option>
</select>

<div id="bloqueCliente" style="display:none;">
  <label for="cliente">Cliente</label><br>
  <input id="cliente" type="text" placeholder="Ej: Cerro" style="width:100%; padding:10px; margin-top:6px; margin-bottom:12px; box-sizing:border-box;">
</div>

<label for="texto">Texto</label><br>
<input id="texto" type="text" placeholder="Ej: Instalar hotfix" style="width:100%; padding:10px; margin-top:6px; margin-bottom:12px; box-sizing:border-box;">

<label for="fecha">Fecha</label><br>
<input id="fecha" type="date" style="width:100%; padding:10px; margin-top:6px; margin-bottom:12px; box-sizing:border-box;">

<label for="hora">Hora</label><br>
<input id="hora" type="time" style="width:100%; padding:10px; margin-top:6px; margin-bottom:12px; box-sizing:border-box;">

<label for="repeticion">Insistencia</label><br>
<select id="repeticion" style="width:100%; padding:10px; margin-top:6px; margin-bottom:12px; box-sizing:border-box;">
  <option value="0">Solo una vez</option>
  <option value="5">Cada 5 minutos</option>
  <option value="10" selected>Cada 10 minutos</option>
  <option value="15">Cada 15 minutos</option>
</select>

<button onclick="activarNotificaciones()" style="width:100%; padding:12px; margin-bottom:10px;">Activar notificaciones</button>
<button onclick="guardarAviso()" id="btnGuardar" style="width:100%; padding:12px; margin-bottom:10px;">Guardar aviso</button>
<button onclick="cancelarEdicion()" id="btnCancelar" style="width:100%; padding:12px; margin-bottom:10px; display:none;">Cancelar edición</button>
<button onclick="probarAvisoManual()" style="width:100%; padding:12px; margin-bottom:10px;">Probar notificación del aviso seleccionado</button>

<p id="estado">Estado: listo</p>
<p id="permiso">Permiso: desconocido</p>
<p id="entorno">Entorno: verificando</p>
<p id="seleccion">Editando: ninguno</p>

<h3 style="margin-top:24px; margin-bottom:8px;">Avisos guardados</h3>
<div id="listaAvisos"></div>

<script>
const STORAGE_KEY = 'avisos_app_v2';
let avisos = [];
let avisoEditandoId = null;
let ultimoChequeoMinuto = null;

window.addEventListener('load', async () => {
  document.getElementById('entorno').innerText = 'Entorno: ' + window.location.origin;

  if ('Notification' in window) {
    document.getElementById('permiso').innerText = 'Permiso: ' + Notification.permission;
  }

  inicializarFechaHoy();
  mostrarCampoCliente();
  cambiarModoCarga();
  cargarDesdeStorage();
  renderAvisos();

  if ('serviceWorker' in navigator) {
    try {
      await navigator.serviceWorker.register('./service-worker.js');
      document.getElementById('estado').innerText = 'Estado: Service Worker registrado';
    } catch (e) {
      document.getElementById('estado').innerText = 'Error SW: ' + e.message;
    }
  }

  setInterval(revisarAvisosAutomaticos, 10000);
});

function inicializarFechaHoy() {
  const hoy = new Date();
  document.getElementById('fecha').value = formatearFechaInput(hoy);
}

function formatearFechaInput(fecha) {
  const anio = fecha.getFullYear();
  const mes = String(fecha.getMonth() + 1).padStart(2, '0');
  const dia = String(fecha.getDate()).padStart(2, '0');
  return `${anio}-${mes}-${dia}`;
}

function activarNotificaciones() {
  if (!('Notification' in window)) {
    alert('No soporta notificaciones');
    return;
  }

  Notification.requestPermission().then(p => {
    document.getElementById('permiso').innerText = 'Permiso: ' + p;
    document.getElementById('estado').innerText = 'Estado: permiso actualizado';
  });
}

function cambiarModoCarga() {
  const modo = document.getElementById('modoCarga').value;
  document.getElementById('bloqueLibre').style.display = modo === 'libre' ? 'block' : 'none';
}

function mostrarCampoCliente() {
  const tipo = document.getElementById('tipo').value;
  document.getElementById('bloqueCliente').style.display = tipo === 'cliente' ? 'block' : 'none';
}

function guardarEnStorage() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(avisos));
}

function cargarDesdeStorage() {
  const guardado = localStorage.getItem(STORAGE_KEY);
  if (!guardado) return;

  try {
    avisos = JSON.parse(guardado) || [];
  } catch (e) {
    avisos = [];
  }
}

function generarId() {
  return Date.now() + Math.floor(Math.random() * 1000);
}

function limpiarFormulario() {
  document.getElementById('modoCarga').value = 'separado';
  document.getElementById('textoLibre').value = '';
  document.getElementById('tipo').value = 'personal';
  document.getElementById('cliente').value = '';
  document.getElementById('texto').value = '';
  document.getElementById('hora').value = '';
  document.getElementById('repeticion').value = '10';
  inicializarFechaHoy();
  avisoEditandoId = null;
  document.getElementById('btnGuardar').innerText = 'Guardar aviso';
  document.getElementById('btnCancelar').style.display = 'none';
  document.getElementById('seleccion').innerText = 'Editando: ninguno';
  cambiarModoCarga();
  mostrarCampoCliente();
}

function cancelarEdicion() {
  limpiarFormulario();
  document.getElementById('estado').innerText = 'Estado: edición cancelada';
}

function obtenerDatosFormulario() {
  const modo = document.getElementById('modoCarga').value;
  let tipo = document.getElementById('tipo').value;
  let cliente = document.getElementById('cliente').value.trim();
  let texto = document.getElementById('texto').value.trim();
  let fecha = document.getElementById('fecha').value;
  let hora = document.getElementById('hora').value;

  if (modo === 'libre') {
    const libre = document.getElementById('textoLibre').value.trim();
    if (!libre) {
      alert('Escribí el texto libre del aviso');
      return null;
    }

    const parseado = interpretarTextoLibre(libre);
    texto = parseado.texto;
    fecha = parseado.fecha;
    hora = parseado.hora;
    tipo = parseado.tipo || tipo;
    cliente = parseado.cliente || cliente;
  }

  const repeticion = Number(document.getElementById('repeticion').value || '0');

  if (!texto) {
    alert('Escribí el texto del aviso');
    return null;
  }

  if (!fecha) {
    alert('Elegí una fecha');
    return null;
  }

  if (!hora) {
    alert('Elegí una hora');
    return null;
  }

  if (tipo === 'cliente' && !cliente) {
    alert('Escribí el nombre del cliente');
    return null;
  }

  return { modo, tipo, cliente, texto, fecha, hora, repeticion };
}

function interpretarTextoLibre(libre) {
  let texto = libre;
  let tipo = document.getElementById('tipo').value;
  let cliente = '';
  let fecha = document.getElementById('fecha').value || formatearFechaInput(new Date());
  let hora = '';

  const matchHora = libre.match(/\b(\d{1,2}):(\d{2})\b/);
  if (matchHora) {
    hora = `${String(matchHora[1]).padStart(2, '0')}:${matchHora[2]}`;
    texto = texto.replace(matchHora[0], '').trim();
  }

  if (/\bmañana\b/i.test(texto)) {
    const manana = new Date();
    manana.setDate(manana.getDate() + 1);
    fecha = formatearFechaInput(manana);
    texto = texto.replace(/\bmañana\b/gi, '').trim();
  } else if (/\bhoy\b/i.test(texto)) {
    fecha = formatearFechaInput(new Date());
    texto = texto.replace(/\bhoy\b/gi, '').trim();
  }

  const matchCliente = texto.match(/(?:cliente|en)\s+([A-Za-zÁÉÍÓÚáéíóúÑñ0-9\s]+)/i);
  if (matchCliente) {
    tipo = 'cliente';
    cliente = matchCliente[1].trim();
  }

  texto = texto
    .replace(/\b(recordame|recordar)\b/gi, '')
    .replace(/\b(cliente)\b/gi, '')
    .replace(/\s+/g, ' ')
    .trim();

  return { texto, tipo, cliente, fecha, hora };
}

function guardarAviso() {
  const datos = obtenerDatosFormulario();
  if (!datos) return;

  if (avisoEditandoId) {
    avisos = avisos.map(aviso => {
      if (aviso.id !== avisoEditandoId) return aviso;
      return {
        ...aviso,
        tipo: datos.tipo,
        cliente: datos.tipo === 'cliente' ? datos.cliente : '',
        titulo: datos.texto,
        fecha: datos.fecha,
        hora: datos.hora,
        repeticion: datos.repeticion,
        hecho: false,
        ultimaNotificacion: null
      };
    });
    document.getElementById('estado').innerText = 'Estado: aviso modificado';
  } else {
    avisos.push({
      id: generarId(),
      tipo: datos.tipo,
      cliente: datos.tipo === 'cliente' ? datos.cliente : '',
      titulo: datos.texto,
      fecha: datos.fecha,
      hora: datos.hora,
      repeticion: datos.repeticion,
      hecho: false,
      ultimaNotificacion: null
    });
    document.getElementById('estado').innerText = 'Estado: aviso guardado';
  }

  ordenarAvisos();
  guardarEnStorage();
  renderAvisos();
  limpiarFormulario();
}

function ordenarAvisos() {
  avisos.sort((a, b) => {
    const valorA = `${a.fecha} ${a.hora}`;
    const valorB = `${b.fecha} ${b.hora}`;
    return valorA.localeCompare(valorB);
  });
}

function editarAviso(id) {
  const aviso = avisos.find(a => a.id === id);
  if (!aviso) return;

  document.getElementById('modoCarga').value = 'separado';
  document.getElementById('tipo').value = aviso.tipo || 'personal';
  document.getElementById('cliente').value = aviso.cliente || '';
  document.getElementById('texto').value = aviso.titulo;
  document.getElementById('fecha').value = aviso.fecha;
  document.getElementById('hora').value = aviso.hora;
  document.getElementById('repeticion').value = String(aviso.repeticion);
  avisoEditandoId = id;
  document.getElementById('btnGuardar').innerText = 'Guardar cambios';
  document.getElementById('btnCancelar').style.display = 'block';
  document.getElementById('seleccion').innerText = 'Editando: ' + aviso.titulo;
  document.getElementById('estado').innerText = 'Estado: editando aviso';
  cambiarModoCarga();
  mostrarCampoCliente();
}

function eliminarAviso(id) {
  avisos = avisos.filter(a => a.id !== id);
  if (avisoEditandoId === id) {
    limpiarFormulario();
  }
  guardarEnStorage();
  renderAvisos();
  document.getElementById('estado').innerText = 'Estado: aviso eliminado';
}

function marcarHecho(id) {
  avisos = avisos.map(aviso => aviso.id === id ? { ...aviso, hecho: true } : aviso);
  guardarEnStorage();
  renderAvisos();
  document.getElementById('estado').innerText = 'Estado: aviso marcado como hecho';
}

function reactivarAviso(id) {
  avisos = avisos.map(aviso => aviso.id === id ? { ...aviso, hecho: false, ultimaNotificacion: null } : aviso);
  guardarEnStorage();
  renderAvisos();
  document.getElementById('estado').innerText = 'Estado: aviso reactivado';
}

function posponerAviso(id, minutos) {
  avisos = avisos.map(aviso => {
    if (aviso.id !== id) return aviso;

    const fechaHora = new Date(`${aviso.fecha}T${aviso.hora}:00`);
    fechaHora.setMinutes(fechaHora.getMinutes() + minutos);

    return {
      ...aviso,
      fecha: formatearFechaInput(fechaHora),
      hora: String(fechaHora.getHours()).padStart(2, '0') + ':' + String(fechaHora.getMinutes()).padStart(2, '0'),
      hecho: false,
      ultimaNotificacion: null
    };
  });

  ordenarAvisos();
  guardarEnStorage();
  renderAvisos();
  document.getElementById('estado').innerText = 'Estado: aviso pospuesto';
}

async function enviarNotificacion(aviso) {
  if (!('Notification' in window) || Notification.permission !== 'granted') {
    document.getElementById('estado').innerText = 'Estado: no hay permiso de notificaciones';
    return;
  }

  try {
    const reg = await navigator.serviceWorker.ready;
    const detalle = aviso.tipo === 'cliente' && aviso.cliente
      ? `${aviso.titulo} - ${aviso.cliente}`
      : aviso.titulo;

    await reg.showNotification('Avisos', {
      body: 'Ahora: ' + detalle,
      tag: 'aviso-' + aviso.id,
      renotify: true
    });
    document.getElementById('estado').innerText = 'Estado: notificación enviada';
  } catch (e) {
    document.getElementById('estado').innerText = 'Error: ' + e.message;
  }
}

async function probarAvisoManual() {
  if (avisos.length === 0) {
    alert('Primero guardá un aviso');
    return;
  }

  const aviso = avisoEditandoId
    ? avisos.find(a => a.id === avisoEditandoId)
    : avisos.find(a => !a.hecho) || avisos[0];

  if (!aviso) {
    alert('No hay aviso disponible');
    return;
  }

  await enviarNotificacion(aviso);
}

function revisarAvisosAutomaticos() {
  const ahora = new Date();
  const fechaActual = formatearFechaInput(ahora);
  const minutoActual = String(ahora.getHours()).padStart(2, '0') + ':' + String(ahora.getMinutes()).padStart(2, '0');
  const sello = `${fechaActual} ${minutoActual}`;

  if (ultimoChequeoMinuto === sello) return;
  ultimoChequeoMinuto = sello;

  let huboCambios = false;

  avisos.forEach(aviso => {
    if (aviso.hecho) return;

    if (aviso.fecha === fechaActual && aviso.hora === minutoActual) {
      enviarNotificacion(aviso);
      aviso.ultimaNotificacion = sello;
      huboCambios = true;
      return;
    }

    if (aviso.repeticion > 0 && aviso.ultimaNotificacion) {
      const siguiente = sumarMinutosFechaHora(aviso.ultimaNotificacion, aviso.repeticion);
      if (siguiente === sello) {
        enviarNotificacion(aviso);
        aviso.ultimaNotificacion = sello;
        huboCambios = true;
      }
    }
  });

  if (huboCambios) {
    guardarEnStorage();
    renderAvisos();
  }
}

function sumarMinutosFechaHora(sello, minutos) {
  const fecha = new Date(sello.replace(' ', 'T') + ':00');
  fecha.setMinutes(fecha.getMinutes() + minutos);
  return `${formatearFechaInput(fecha)} ${String(fecha.getHours()).padStart(2, '0')}:${String(fecha.getMinutes()).padStart(2, '0')}`;
}

function renderGrupo(titulo, lista) {
  if (lista.length === 0) {
    return `<div style="margin-bottom:16px;"><h4 style="margin-bottom:8px;">${titulo}</h4><p style="color:#666;">Sin avisos.</p></div>`;
  }

  return `
    <div style="margin-bottom:16px;">
      <h4 style="margin-bottom:8px;">${titulo}</h4>
      ${lista.map(aviso => {
        const frecuenciaTexto = aviso.repeticion === 0 ? 'Una vez' : 'Cada ' + aviso.repeticion + ' min';
        const clienteTexto = aviso.tipo === 'cliente' && aviso.cliente
          ? `<div style="font-size:14px; color:#555; margin-bottom:4px;">Cliente: ${aviso.cliente}</div>`
          : '';

        return `
          <div style="border:1px solid #ddd; padding:10px; margin-bottom:10px; border-radius:8px; background:${aviso.hecho ? '#f3f4f6' : '#fff'};">
            <div style="display:flex; justify-content:space-between; gap:8px; margin-bottom:4px;">
              <div style="font-weight:bold;">${aviso.titulo}</div>
              <div style="font-size:12px; color:#555; text-transform:capitalize;">${aviso.tipo}</div>
            </div>
            ${clienteTexto}
            <div style="font-size:14px; color:#555; margin-bottom:4px;">Fecha: ${aviso.fecha}</div>
            <div style="font-size:14px; color:#555; margin-bottom:4px;">Hora: ${aviso.hora}</div>
            <div style="font-size:14px; color:#555; margin-bottom:4px;">Insistencia: ${frecuenciaTexto}</div>
            <div style="font-size:14px; color:${aviso.hecho ? '#166534' : '#555'}; margin-bottom:8px;">Estado: ${aviso.hecho ? 'Hecho' : 'Pendiente'}</div>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px;">
              <button onclick="editarAviso(${aviso.id})">Modificar</button>
              <button onclick="eliminarAviso(${aviso.id})">Eliminar</button>
              ${aviso.hecho
                ? `<button onclick="reactivarAviso(${aviso.id})">Reactivar</button><div></div>`
                : `<button onclick="marcarHecho(${aviso.id})">Hecho</button><button onclick="posponerAviso(${aviso.id}, 10)">+10 min</button>`}
            </div>
          </div>
        `;
      }).join('')}
    </div>
  `;
}

function renderAvisos() {
  const contenedor = document.getElementById('listaAvisos');

  if (avisos.length === 0) {
    contenedor.innerHTML = '<p style="color:#666;">No hay avisos guardados.</p>';
    return;
  }

  const clientes = avisos.filter(a => a.tipo === 'cliente');
  const personales = avisos.filter(a => a.tipo !== 'cliente');

  contenedor.innerHTML = renderGrupo('Clientes', clientes) + renderGrupo('Personales', personales);
}
</script>

</body>
</html>
