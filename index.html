<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avisos</title>
  <link rel="manifest" href="./manifest.json">
</head>
<body style="font-family: Arial; padding:20px">

<h2>Avisos</h2>

<button onclick="activarNotificaciones()">Activar notificaciones</button>
<br><br>

<button onclick="crearAviso()">Crear aviso de prueba</button>
<br><br>

<button onclick="probarAviso()">Probar notificación</button>
<br><br>

<button onclick="borrarAviso()">Borrar aviso</button>

<p id="estado">Estado: listo</p>
<p id="permiso">Permiso: desconocido</p>
<p id="entorno">Entorno: verificando</p>
<p id="tarea">Aviso actual: ninguno</p>

<script>
let tarea = null;

// Registrar service worker cuando la página carga
window.addEventListener('load', async () => {
  document.getElementById('entorno').innerText = 'Entorno: ' + window.location.origin;

  if ('Notification' in window) {
    document.getElementById('permiso').innerText = 'Permiso: ' + Notification.permission;
  }

  if ('serviceWorker' in navigator) {
    try {
      await navigator.serviceWorker.register('./service-worker.js');
      document.getElementById('estado').innerText = 'Estado: Service Worker registrado';
    } catch (e) {
      document.getElementById('estado').innerText = 'Error SW: ' + e.message;
    }
  }
});

function activarNotificaciones() {
  if (!('Notification' in window)) {
    alert('No soporta notificaciones');
    return;
  }

  Notification.requestPermission().then(p => {
    document.getElementById('permiso').innerText = 'Permiso: ' + p;
  });
}

function crearAviso() {
  tarea = { titulo: 'Prueba de aviso' };
  document.getElementById('tarea').innerText = 'Aviso actual: ' + tarea.titulo;
  document.getElementById('estado').innerText = 'Estado: aviso creado';
}

function borrarAviso() {
  tarea = null;
  document.getElementById('tarea').innerText = 'Aviso actual: ninguno';
  document.getElementById('estado').innerText = 'Estado: aviso borrado';
}

async function probarAviso() {
  if (!tarea) {
    alert('Primero creá el aviso');
    return;
  }

  if (Notification.permission !== 'granted') {
    alert('No hay permiso de notificaciones');
    return;
  }

  try {
    const reg = await navigator.serviceWorker.ready;

    await reg.showNotification('Avisos', {
      body: 'Ahora: ' + tarea.titulo
    });

    document.getElementById('estado').innerText = 'Estado: notificación enviada';

  } catch (e) {
    document.getElementById('estado').innerText = 'Error: ' + e.message;
  }
}
</script>

</body>
</html>
